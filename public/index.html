<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TFDiagram</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#d8d8d8; --accent:#c2410c; --card:#fff; --edge:#64748b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#999; --line:#333; --accent:#fb923c; --card:#1b1b1b; --edge:#94a3b8; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px; }
  h1 { margin: 0 0 4px; } p.sub { margin: 0 0 24px; color: var(--muted); }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text], input[type=password] { flex:1 1 280px; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  textarea { flex:1 1 100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:13px/1.4 ui-monospace, monospace; }
  select { padding:4px; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  button { padding:10px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .opts { margin:12px 0; display:flex; gap:16px; flex-wrap:wrap; color:var(--muted); font-size:14px; }
  #status { margin:16px 0; color:var(--muted); } #status.err { color:#dc2626; }
  #out { border:1px solid var(--line); border-radius:8px; padding:16px; overflow:auto; min-height:80px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .tabs button { background:transparent; color:var(--fg); border:1px solid var(--line); padding:6px 12px; font-size:14px; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .legend { display:flex; flex-wrap:wrap; gap:8px 18px; margin:10px 0; font-size:13px; color:var(--muted); }
  .legend span.k { display:inline-flex; align-items:center; gap:6px; }
  .legend i { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .legend b { color:var(--fg); font-weight:600; }
  details { margin-top:16px; } pre { overflow:auto; background:rgba(128,128,128,.1); padding:12px; border-radius:6px; }
</style>
</head>
<body>
<main>
  <h1>TFDiagram</h1>
  <p class="sub">Paste Terraform code or a GitHub repo URL (AWS or Azure) and get an architecture diagram.</p>
  <div class="opts">
    <label><input type="radio" name="mode" value="paste" checked> Paste code</label>
    <label><input type="radio" name="mode" value="repo"> GitHub URL</label>
    <label>Cloud:
      <select id="provider"><option value="auto">Auto-detect</option><option value="aws">AWS</option><option value="azure">Azure</option></select>
    </label>
  </div>
  <form id="f">
    <textarea id="code" rows="12" placeholder='resource "aws_vpc" "main" { ... }  (paste one or more .tf files)'></textarea>
    <input type="text" id="repo" hidden placeholder="https://github.com/owner/repo or .../tree/main/infra">
    <button id="go">Generate</button>
  </form>
  <div class="opts">
    <label><input type="checkbox" id="simplify" checked> Hide plumbing (IAM attachments, SG rules, associations)</label>
    <label id="tokenLabel" hidden>GitHub token (private repos): <input type="password" id="token" autocomplete="off" size="20"></label>
  </div>
  <div id="status"></div><div id="stat" style="color:var(--muted);font-size:14px"></div>
  <div id="view" hidden>
    <div id="tabs" class="tabs"></div>
    <div class="opts">
      <input type="text" id="q" placeholder="Filter: name or type (e.g. subnet)" size="28">
      <label>Module: <select id="scope"></select></label>
      <label><input type="checkbox" id="collapse"> Collapse modules</label>
      <label>Detail: <select id="detail"><option value="overview">Overview</option><option value="detailed">Every resource</option></select></label>
      <label>Direction: <select id="dir"><option value="LR">Left to right</option><option value="TB">Top to bottom</option></select></label>
      <label><input type="checkbox" id="fit"> Fit to width</label>
    </div>
  </div>
  <div id="legend" class="legend"></div>
  <div id="out"></div>
  <details><summary>Mermaid source</summary><pre id="src"></pre></details>
</main>
<script src="vendor/dagre.min.js"></script>
<script type="module">

import { COLORS, filterGraph, summarize, toMermaid } from './render.js';
import { renderDiagram } from './diagram.js';
const $ = (id) => document.getElementById(id);
let lastData = null;
let layer = ''; // '' = all layers
const mode = () => document.querySelector('input[name=mode]:checked').value;
function syncMode() {
  const paste = mode() === 'paste';
  $('code').hidden = !paste; $('repo').hidden = paste; $('tokenLabel').hidden = paste;
  $('code').required = paste; $('repo').required = !paste;
}
document.querySelectorAll('input[name=mode]').forEach((r) => r.addEventListener('change', syncMode));
syncMode();

const LAYER_ORDER = ['Networking', 'Compute', 'Data', 'Security & IAM', 'Modules', 'Data sources', 'Other'];
function buildControls() {
  const g = lastData.graph;
  const leaves = g.nodes.filter((n) => !(n.kind === 'module' && n.expanded));
  const counts = new Map();
  leaves.forEach((n) => counts.set(n.category, (counts.get(n.category) ?? 0) + 1));
  const cats = [...counts.keys()].sort((a, b) => LAYER_ORDER.indexOf(a) - LAYER_ORDER.indexOf(b));
  $('tabs').replaceChildren(...[['', `All (${leaves.length})`], ...cats.map((c) => [c, `${c} (${counts.get(c)})`])].map(([value, text]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = text; b.dataset.layer = value;
    b.addEventListener('click', () => { layer = value; draw(); });
    return b;
  }));
  const mods = g.nodes.filter((n) => n.kind === 'module' && n.expanded);
  $('scope').replaceChildren(new Option('Whole repo', ''), ...mods.map((m) => new Option(m.id, m.id)));
  $('view').hidden = false;
}

async function draw() {
  if (!lastData) return;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.layer === layer));
  const view = filterGraph(lastData.graph, {
    scope: $('scope').value, collapse: $('collapse').checked, query: $('q').value,
    layers: layer ? new Set([layer]) : null, neighbors: Boolean(layer),
  });
  const shown = view.nodes.filter((n) => !n.ghost && !(n.kind === 'module' && n.expanded)).length;
  $('stat').textContent = layer || $('q').value ? ` Showing ${shown} resources` + (layer ? ` in ${layer} (dashed = connected from other layers)` : '') : '';
  if (!view.nodes.length) { $('out').textContent = 'Nothing matches the filter.'; $('src').textContent = ''; return; }
  const overview = $('detail').value === 'overview';
  const shownGraph = overview ? summarize(view) : view;
  $('src').textContent = toMermaid(shownGraph, { direction: $('dir').value, flow: true, colors: true });
  drawLegend(shownGraph);
  try {
    const { owner, repo, branch } = lastData;
    $('out').innerHTML = renderDiagram(shownGraph, { direction: $('dir').value, link: owner ? { owner, repo, branch } : null });
    const el = $('out').querySelector('svg');
    if ($('fit').checked && el) { el.removeAttribute('height'); el.style.width = '100%'; el.style.height = 'auto'; }
  } catch (e) { $('out').textContent = 'Could not draw this view: ' + e.message; }
}

const MEANING = {
  Networking: 'VPCs, subnets, gateways, routes, load balancers, DNS',
  Compute: 'VMs, containers, functions, autoscaling',
  Data: 'databases, storage, queues, caches',
  'Security & IAM': 'security groups, roles, keys, policies',
  Modules: 'Terraform modules',
  'Data sources': 'existing things Terraform only reads',
  Other: 'everything not matched above',
};
function drawLegend(g) {
  const cats = [...new Set(g.nodes.filter((n) => !(n.kind === 'module' && n.expanded)).map((n) => n.category))];
  const key = (c) => `<span class="k"><i style="background:${COLORS[c] ?? COLORS.Other}"></i><b>${c}</b> ${MEANING[c] ?? ''}</span>`;
  $('legend').innerHTML = cats.map(key).join('') +
    '<span class="k"><b>→</b> flows from a resource to what uses it</span>' +
    '<span class="k"><b>×N</b> N resources of that type grouped</span>' +
    '<span class="k"><b>dashed card</b> connected from another layer</span>' +
    '<span class="k"><b>dashed purple box</b> an expanded module</span>';
}
for (const id of ['scope', 'collapse', 'dir', 'fit', 'detail']) $(id).addEventListener('change', draw);
$('q').addEventListener('input', () => { clearTimeout($('q')._t); $('q')._t = setTimeout(draw, 250); });

async function run() {
  $('go').disabled = true; $('status').className = ''; $('status').textContent = mode() === 'paste' ? 'Parsing…' : 'Fetching Terraform files…';
  try {
    const qs = `simplify=${$('simplify').checked ? 1 : 0}&provider=${$('provider').value}`;
    const res = mode() === 'paste'
      ? await fetch(`/api/diagram?${qs}`, { method: 'POST', body: JSON.stringify({ code: $('code').value }) })
      : await fetch(`/api/diagram?repo=${encodeURIComponent($('repo').value)}&${qs}`, { headers: $('token').value ? { 'x-github-token': $('token').value } : {} });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    const { edges } = data.graph;
    const nodes = data.graph.nodes.filter((n) => n.kind !== 'module' || !n.expanded);
    const mods = data.graph.nodes.filter((n) => n.kind === 'module' && n.expanded).length;
    const where = data.owner ? `${data.owner}/${data.repo}@${data.branch}: ${data.fileCount} files, ` : '';
    $('status').textContent = `${where}${data.graph.provider.toUpperCase()}: ${nodes.length} resources${mods ? `, ${mods} expanded modules` : ''}, ${edges.length} dependencies` + (data.truncated ? ' (repo tree truncated)' : '');
    if (!nodes.length) { $('view').hidden = true; $('out').textContent = 'No ' + data.graph.provider.toUpperCase() + ' resources found. Try the other cloud in the dropdown.'; return; }
    lastData = data;
    layer = ''; $('q').value = ''; $('scope').value = ''; 
    buildControls();
    await draw();
    if (mode() === 'repo') history.replaceState(null, '', '?repo=' + encodeURIComponent($('repo').value));
  } catch (e) {
    $('status').className = 'err'; $('status').textContent = e.message;
  } finally { $('go').disabled = false; }
}
$('f').addEventListener('submit', (e) => { e.preventDefault(); run(); });
const q = new URLSearchParams(location.search).get('repo');
if (q) { document.querySelector('input[value=repo]').checked = true; syncMode(); $('repo').value = q; run(); }
</script>
</body>
</html>
